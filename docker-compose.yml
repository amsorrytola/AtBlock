services:
  gateway:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: npm run dev:gateway
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8787"
      PUBLIC_GATEWAY_URL: http://localhost:8787
  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: npm run dev:web
    ports:
      - "5173:5173"
    environment:
      VITE_GATEWAY_URL: http://localhost:8787
    depends_on:
      - gateway
